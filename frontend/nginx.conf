server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

#serve static files (css, js, etc)
    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        try_files $uri /index.html;
    }

    error_page 404 /index.html;
}